# MayOS 0.5.0-pre2-dev: Limine is the default boot interface.
# Syntax is pinned to Limine v12.10.0 CONFIG.md.
timeout: 3
default_entry: 1
graphics: yes
interface_resolution: 1280x720
interface_branding: MayOS · Limine Boot Manager
interface_branding_colour: ffffff
interface_help_colour: a1a1a5
wallpaper: boot():/boot/mayos-brand.png
wallpaper_style: stretched
term_background: 90000000
term_foreground: ffffff
term_margin: 96

/Start MayKernel64
    comment: Native MayKernel x86_64
    protocol: multiboot1
    kernel_path: boot():/boot/mayos.elf
    resolution: 1280x720x32

/Start Linux64
    comment: Linux x86_64 desktop session
    protocol: linux
    kernel_path: boot():/boot/vmlinuz
    module_path: boot():/boot/initramfs.cpio.gz
    kernel_cmdline: console=ttyS0 quiet
    resolution: 1280x720x32
