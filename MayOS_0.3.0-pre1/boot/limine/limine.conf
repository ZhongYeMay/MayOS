# MayOS 0.5.0-pre2-dev: Limine is the default boot interface.
# The existing GRUB files remain only as a source-tree rollback path.
TIMEOUT=3
DEFAULT_ENTRY=1
INTERFACE_BRANDING=MayOS
INTERFACE_RESOLUTION=1280x720
BACKGROUND_PATH=boot():/boot/mayos-brand.png
BACKGROUND_STYLE=stretched
TERM_BACKGROUND=000000
TERM_FOREGROUND=ffffff

/Start MayKernel64
    PROTOCOL=multiboot
    KERNEL_PATH=boot():/boot/mayos.elf

/Start Linux64
    PROTOCOL=linux
    KERNEL_PATH=boot():/boot/vmlinuz
    MODULE_PATH=boot():/boot/initramfs.cpio.gz
    CMDLINE=console=ttyS0 quiet

/Reboot
    PROTOCOL=chainload
    KERNEL_PATH=boot():/EFI/BOOT/BOOTX64.EFI

/Shutdown
    PROTOCOL=chainload
    KERNEL_PATH=boot():/EFI/BOOT/BOOTX64.EFI
