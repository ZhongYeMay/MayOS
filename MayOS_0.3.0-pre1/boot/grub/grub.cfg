set timeout=3
set default=0
set gfxmode=1024x768x32,1024x768,800x600x32,800x600,640x480x32,640x480,auto
insmod all_video
insmod cpuid
set gfxpayload=$gfxmode
if cpuid -l; then
menuentry "MayOS · 64-bit custom kernel" {
 multiboot /boot/mayos.elf
 # Multiboot loading resets gfxpayload from its header; select mode afterwards.
 set gfxpayload=$gfxmode
 boot
}
else
menuentry "MayOS requires an x86_64 CPU" {
 echo "MayKernel is 64-bit; this CPU does not support long mode."
 sleep 10
}
fi
