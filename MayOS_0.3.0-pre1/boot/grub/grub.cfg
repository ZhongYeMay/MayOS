set timeout_style=menu
set timeout=5
set default=0
set gfxmode=1024x768x32,1024x768,800x600x32,800x600,640x480x32,640x480,auto
insmod all_video
# Serial menu access remains usable for firmware with unreliable video output.
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
set gfxpayload=$gfxmode
menuentry "MayOS · custom kernel" {
 multiboot /boot/mayos.elf
 # Multiboot loading resets gfxpayload from its header; select mode afterwards.
 set gfxpayload=$gfxmode
 boot
}

# Optional fallback if the normal firmware graphics mode cannot be used.
menuentry "MayOS - custom kernel (safe graphics)" --id mayos-safe {
 set gfxmode=640x480x32,800x600x16,auto
 set gfxpayload=$gfxmode
 multiboot /boot/mayos.elf
 set gfxpayload=$gfxmode
 boot
}
