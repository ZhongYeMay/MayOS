set default=0
source /boot/grub/menu.cfg
set gfxpayload=keep
function mayos_video_boot {
 terminal_output console serial
 set gfxmode=$1,auto
 if terminal_output --append gfxterm; then
   terminal_output --remove console
 fi
 multiboot /boot/mayos.elf
 if [ -f /boot/mayos-import.mfp ]; then
   module /boot/mayos-import.mfp mayos-import
 fi
 set gfxpayload=keep
 boot
}
if cpuid -l; then
menuentry "Start MayKernel64" {
 multiboot /boot/mayos.elf
 if [ -f /boot/mayos-wallpaper.mwb ]; then
   module /boot/mayos-wallpaper.mwb mayos-wallpaper
 fi
 # Multiboot loading resets gfxpayload from its header; select mode afterwards.
 if [ -f /boot/mayos-import.mfp ]; then
   module /boot/mayos-import.mfp mayos-import
 fi
 set gfxpayload=keep
 boot
}
menuentry "MayOS Live @MAYOS_VERSION@ (RAM only; no disk writes)" --id mayos-live {
 multiboot /boot/mayos.elf mayos.ram
 if [ -f /boot/mayos-wallpaper.mwb ]; then
   module /boot/mayos-wallpaper.mwb mayos-wallpaper
 fi
 if [ -f /boot/mayos-import.mfp ]; then
   module /boot/mayos-import.mfp mayos-import
 fi
 set gfxpayload=keep
 boot
}
submenu "MayKernel64 display modes" {
 menuentry "1280 × 720" { mayos_video_boot 1280x720x32; }
 menuentry "1920 × 1080" { mayos_video_boot 1920x1080x32; }
 menuentry "3840 × 2160" { mayos_video_boot 3840x2160x32; }
}

else
menuentry "MayOS requires an x86_64 CPU" {
 echo "MayKernel is 64-bit; this CPU does not support long mode."
 sleep 10
}
fi
