# Shared by the MayKernel ISO and the dual-kernel ISO.
set timeout_style=menu
set timeout=5
# Ask GRUB firmware video backend for the preferred supported output first.
# These are compatible fallbacks, NOT a forced 16:9/1280x720 default.
# UEFI GOP / BIOS VBE decide the exposed modes; kernel never invents EDID modes.
set gfxmode=auto,4096x2160x32,3840x2160x32,3440x1440x32,2560x1440x32,2560x1600x32,1920x1200x32,1920x1080x32,1600x1200x32,1280x1024x32,1280x800x32,1024x768x32,800x600x32,640x480x32
insmod all_video
insmod cpuid
insmod gfxterm
insmod png
insmod serial
if serial --unit=0 --speed=115200; then
    terminal_input console serial
    terminal_output console serial
fi
if loadfont /boot/grub/fonts/mayos-menu.pf2 /boot/grub/fonts/mayos-console.pf2; then
    set gfxterm_font="DejaVu Sans Mono Regular 14"
    if terminal_output --append gfxterm; then
        terminal_output --remove console
        set theme=/boot/grub/themes/mayos/theme.txt
        export theme
    fi
fi
