set default=0
source /boot/grub/menu.cfg
set gfxpayload=keep
if cpuid -l; then
menuentry "Start MayKernel64" {
 multiboot /boot/mayos.elf
 if [ -f /boot/mayos-wallpaper.mwb ]; then
   module /boot/mayos-wallpaper.mwb mayos-wallpaper
 fi
 # Multiboot loading resets gfxpayload from its header; select mode afterwards.
 set gfxpayload=keep
 boot
}
menuentry "MayOS Live 0.5.4-pre3 (RAM only; no disk writes)" --id mayos-live {
 multiboot /boot/mayos.elf mayos.ram
 if [ -f /boot/mayos-wallpaper.mwb ]; then
   module /boot/mayos-wallpaper.mwb mayos-wallpaper
 fi
 set gfxpayload=keep
 boot
}
else
menuentry "MayOS requires an x86_64 CPU" {
 echo "MayKernel is 64-bit; this CPU does not support long mode."
 sleep 10
}
fi
