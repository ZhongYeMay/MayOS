name: MayKernel offline signed 64KiB ATA image end-to-end
on:
  pull_request:
    paths:
      - 'MayOS_0.3.0-pre1/kernel/update.c'
      - 'MayOS_0.3.0-pre1/kernel/update.h'
      - 'MayOS_0.3.0-pre1/kernel/update_stage_disk.*'
      - 'MayOS_0.3.0-pre1/kernel/gui.c'
      - 'MayOS_0.3.0-pre1/scripts/signed_stage_e2e_smoke.py'
      - 'MayOS_0.3.0-pre1/Makefile'
      - '.github/workflows/maykernel-signed-stage-qemu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-owner-key-signed-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust no_std cryptographic toolchain
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target x86_64-unknown-none
          rustup default 1.85.1
      - name: Install signed build tools and QEMU
        run: |
          bash scripts/configure-ci-apt-mirror.sh
          sudo apt-get install -y --no-install-recommends \
            gcc binutils make python3 python3-pil fonts-noto-cjk openssl \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools qemu-system-x86
      - name: Generate temporary signing key and signed 64KiB MayOS image
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm Ed25519 -out "$RUNNER_TEMP/mayos-signed-stage-secret.pem"
          openssl pkey -in "$RUNNER_TEMP/mayos-signed-stage-secret.pem" -pubout \
            -out "$RUNNER_TEMP/mayos-signed-stage-public.pem"
          openssl pkey -in "$RUNNER_TEMP/mayos-signed-stage-secret.pem" -pubout -outform DER \
            -out "$RUNNER_TEMP/mayos-signed-stage-public.der"
          python3 - <<'PY'
          from pathlib import Path
          import os
          t=Path(os.environ["RUNNER_TEMP"])
          binary=(t/"mayos-signed-stage-public.der").read_bytes()
          prefix=bytes.fromhex("302a300506032b6570032100")
          assert len(binary)==44 and binary.startswith(prefix)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as output:
              output.write("MAYOS_SIGNED_STAGE_PUBHEX="+binary[12:].hex()+"\n")
          data=bytes((((i*13)^(i>>5)^0xa5)&255) for i in range(65536))
          (t/"MayOS-64KiB-signed-test.bin").write_bytes(data)
          PY
          python3 MayOS_0.3.0-pre1/scripts/package_signed_release.py \
            --image "$RUNNER_TEMP/MayOS-64KiB-signed-test.bin" \
            --private-key "$RUNNER_TEMP/mayos-signed-stage-secret.pem" \
            --output-dir "$RUNNER_TEMP/mayos-stage-package" \
            --version 0.5.0-pre3 --date 2026-11-20 \
            --eta-minutes 7 --changelog 'Signed staged QEMU fixture'
          python3 MayOS_0.3.0-pre1/scripts/verify_signed_release.py \
            --image "$RUNNER_TEMP/MayOS-64KiB-signed-test.bin" \
            --manifest "$RUNNER_TEMP/mayos-stage-package/Update.may" \
            --signature "$RUNNER_TEMP/mayos-stage-package/Update.sig" \
            --trusted-public-key "$RUNNER_TEMP/mayos-signed-stage-public.pem"
      - name: Build genuine x86_64 Rust+C MayKernel with pinned ephemeral public key
        shell: bash
        run: |
          set -euo pipefail
          make -C MayOS_0.3.0-pre1 MAYOS_RELEASE_SIGNATURE=1 \
            MAYOS_STAGE_DISK_DIAGNOSTIC=1 \
            MAYOS_RELEASE_PUBKEY_HEX="$MAYOS_SIGNED_STAGE_PUBHEX" all
          nm -g MayOS_0.3.0-pre1/build/mayos.elf | grep ' mayrs_ed25519_verify$'
          nm -g MayOS_0.3.0-pre1/build/mayos.elf | grep ' may_stage_diag_matches_signed$'
      - name: Actual QEMU Ed25519 + 64KiB on-disk streaming and all tamper cases
        run: |
          python3 MayOS_0.3.0-pre1/scripts/signed_stage_e2e_smoke.py \
            --package-dir "$RUNNER_TEMP/mayos-stage-package" \
            --image "$RUNNER_TEMP/MayOS-64KiB-signed-test.bin"
      - name: Upload only true QEMU screens/serial; NEVER signing private key
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maykernel-ed25519-64k-ata-signed-stage-qemu
          retention-days: 30
          if-no-files-found: warn
          path: |
            MayOS_0.3.0-pre1/build/signed-stage-*.png
            MayOS_0.3.0-pre1/build/signed-stage-*.log
            MayOS_0.3.0-pre1/build/signed-stage-*-qemu.log
