name: MayKernel signed 64KiB stream to isolated ATA QEMU
on:
  pull_request:
    paths:
      - 'MayOS_0.3.0-pre1/kernel/update.c'
      - 'MayOS_0.3.0-pre1/kernel/update.h'
      - 'MayOS_0.3.0-pre1/kernel/gui.c'
      - 'MayOS_0.3.0-pre1/kernel/update_stage_disk.*'
      - 'MayOS_0.3.0-pre1/kernel/update_stream_integrity.*'
      - 'MayOS_0.3.0-pre1/scripts/signed_stream_ata_smoke.py'
      - 'MayOS_0.3.0-pre1/scripts/signed_stream_ata_video.py'
      - 'MayOS_0.3.0-pre1/Makefile'
      - '.github/workflows/maykernel-signed-ata-stream-qemu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-ata-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust and real QEMU prerequisites
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target x86_64-unknown-none
          rustup default 1.85.1
          bash scripts/configure-ci-apt-mirror.sh
          sudo apt-get install -y --no-install-recommends \
            gcc binutils make python3 python3-pil fonts-noto-cjk openssl ffmpeg \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools qemu-system-x86
      - name: Create ephemeral offline Ed25519 key and independent 64KiB fixtures
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm Ed25519 -out "$RUNNER_TEMP/signed-ata-secret.pem"
          openssl pkey -in "$RUNNER_TEMP/signed-ata-secret.pem" \
            -pubout -outform DER -out "$RUNNER_TEMP/signed-ata-public.der"
          python3 - <<'PY'
          from pathlib import Path
          import os
          temp=Path(os.environ["RUNNER_TEMP"])
          der=(temp/"signed-ata-public.der").read_bytes()
          prefix=bytes.fromhex("302a300506032b6570032100")
          assert len(der)==44 and der.startswith(prefix)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write("MAYOS_SIGNED_ATA_PUBHEX="+der[12:].hex()+"\n")
          raw=bytes((((i*13)^(i>>5)^0xa5)&255) for i in range(65536))
          changed=bytearray(raw);changed[16000]^=0x20
          (temp/"signed-ata-good.bin").write_bytes(raw)
          (temp/"signed-ata-bad.bin").write_bytes(changed)
          PY
          python3 MayOS_0.3.0-pre1/scripts/package_signed_release.py \
            --image "$RUNNER_TEMP/signed-ata-good.bin" \
            --private-key "$RUNNER_TEMP/signed-ata-secret.pem" \
            --output-dir "$RUNNER_TEMP/signed-ata-good-pkg" \
            --version 0.5.0-pre3 --date 2026-11-21 \
            --eta-minutes 6 --changelog 'Signed 64KiB staged ATA offline fixture'
          python3 MayOS_0.3.0-pre1/scripts/package_signed_release.py \
            --image "$RUNNER_TEMP/signed-ata-bad.bin" \
            --private-key "$RUNNER_TEMP/signed-ata-secret.pem" \
            --output-dir "$RUNNER_TEMP/signed-ata-bad-pkg" \
            --version 0.5.0-pre3 --date 2026-11-21 \
            --eta-minutes 6 --changelog 'Signed 64KiB incorrect ATA test image'
      - name: Build actual freestanding Rust+C x86_64 ATA diagnostic kernel
        shell: bash
        run: |
          set -euo pipefail
          make -C MayOS_0.3.0-pre1 MAYOS_SIGNED_ATA_STREAM_DIAGNOSTIC=1 \
            MAYOS_RELEASE_PUBKEY_HEX="$MAYOS_SIGNED_ATA_PUBHEX" all
          nm -g MayOS_0.3.0-pre1/build/mayos.elf | grep ' mayrs_ed25519_verify$'
          nm -g MayOS_0.3.0-pre1/build/mayos.elf | grep ' may_update_signed_ata_stream_diagnostic$'
          nm -g MayOS_0.3.0-pre1/build/mayos.elf | grep ' may_stage_diag_append$'
      - name: QEMU signed stream-to-disk, cold boot, post-verify tamper and foreign disk
        run: |
          python3 MayOS_0.3.0-pre1/scripts/signed_stream_ata_smoke.py \
            --package-dir "$RUNNER_TEMP/signed-ata-good-pkg" \
            --wrong-hash-package-dir "$RUNNER_TEMP/signed-ata-bad-pkg"
      - name: Record actual QEMU terminal and signing verdict as MP4
        run: |
          python3 MayOS_0.3.0-pre1/scripts/signed_stream_ata_video.py \
            --package-dir "$RUNNER_TEMP/signed-ata-good-pkg"
      - name: Upload real QEMU guest screenshots and logs, never signing keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maykernel-signed-stream-to-ata-real-qemu
          retention-days: 30
          if-no-files-found: warn
          path: |
            MayOS_0.3.0-pre1/build/signed-ata-*.png
            MayOS_0.3.0-pre1/build/signed-ata-*.log
            MayOS_0.3.0-pre1/build/signed-ata-*-qemu.log
            MayOS_0.3.0-pre1/build/MayOS-signed-stream-to-ATA-real-QEMU.mp4
