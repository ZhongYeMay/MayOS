name: MayKernel BearSSL native test CA X509 verification
on:
  pull_request:
    paths:
      - 'MayOS_0.3.0-pre1/kernel/security_tls_x509_fixture.c'
      - 'MayOS_0.3.0-pre1/kernel/gui.c'
      - 'MayOS_0.3.0-pre1/scripts/generate_tls_x509_fixture.py'
      - 'MayOS_0.3.0-pre1/scripts/tls_x509_fixture_smoke.py'
      - 'MayOS_0.3.0-pre1/Makefile'
      - '.github/workflows/maykernel-tls-x509-qemu.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  BEARSSL_PIN: 79c060eea3eea1257797f15ea1608a9a9923aa6f
jobs:
  native-x509-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu signed QEMU and build dependencies
        run: |
          bash scripts/configure-ci-apt-mirror.sh
          sudo apt-get install -y --no-install-recommends \
            gcc binutils make python3 python3-pil fonts-noto-cjk openssl \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools qemu-system-x86
      - name: Check out exact pinned official upstream BearSSL
        run: |
          git clone --quiet https://www.bearssl.org/git/BearSSL vendor/bearssl
          git -C vendor/bearssl checkout -q --detach "$BEARSSL_PIN"
          test "$(git -C vendor/bearssl rev-parse HEAD)" = "$BEARSSL_PIN"
      - name: Generate one-time CI-only RSA CA and DNS SAN server leaf
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 10 \
            -subj "/CN=MayOS Temporary CI Test CA" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign" \
            -keyout "$RUNNER_TEMP/test-ca.key" -out "$RUNNER_TEMP/test-ca.pem"
          openssl req -newkey rsa:2048 -nodes \
            -subj "/CN=test.mayos.local" \
            -keyout "$RUNNER_TEMP/test-leaf.key" -out "$RUNNER_TEMP/test-leaf.csr"
          cat > "$RUNNER_TEMP/leaf-ext.cnf" <<'EOF'
          basicConstraints=critical,CA:FALSE
          keyUsage=critical,digitalSignature,keyEncipherment
          extendedKeyUsage=serverAuth
          subjectAltName=DNS:test.mayos.local
          EOF
          openssl x509 -req -in "$RUNNER_TEMP/test-leaf.csr" \
            -CA "$RUNNER_TEMP/test-ca.pem" \
            -CAkey "$RUNNER_TEMP/test-ca.key" -CAcreateserial \
            -out "$RUNNER_TEMP/test-leaf.pem" \
            -days 5 -sha256 -extfile "$RUNNER_TEMP/leaf-ext.cnf"
          openssl verify -CAfile "$RUNNER_TEMP/test-ca.pem" "$RUNNER_TEMP/test-leaf.pem"
          python3 MayOS_0.3.0-pre1/scripts/generate_tls_x509_fixture.py \
            --ca "$RUNNER_TEMP/test-ca.pem" \
            --leaf "$RUNNER_TEMP/test-leaf.pem" \
            --output MayOS_0.3.0-pre1/build/tls_x509_fixture.h
          test -s MayOS_0.3.0-pre1/build/tls_x509_fixture.h
      - name: Build native MayKernel BearSSL X509 fixture and boot real QEMU
        run: |
          make -C MayOS_0.3.0-pre1 \
            BEARSSL_SOURCE="$GITHUB_WORKSPACE/vendor/bearssl" \
            MAYOS_TLS_X509_DIAGNOSTIC=1 test-tls-x509-qemu
          nm -g MayOS_0.3.0-pre1/build/mayos.elf |
            grep ' may_tls_x509_fixture_selftest$'
          echo 'PASS: BearSSL real X509 verifier linked and tested in MayKernel ELF64'
      - name: Preserve actual QEMU framebuffer and serial logs; never private keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maykernel-native-bearssl-real-x509-test-ca-qemu
          retention-days: 30
          if-no-files-found: warn
          path: |
            MayOS_0.3.0-pre1/build/maykernel-bearssl-x509-*.png
            MayOS_0.3.0-pre1/build/maykernel-bearssl-x509-*.log
            MayOS_0.3.0-pre1/build/maykernel-bearssl-x509-*-qemu.log
