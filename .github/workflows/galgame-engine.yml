name: Test native Galgame engine
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'MayOS_0.3.0-pre1/native-game/**'
      - '.github/workflows/galgame-engine.yml'
permissions:
  contents: read
jobs:
  story-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pin original game
        run: |
          git clone --quiet https://github.com/ZhongYeMay/galgame.git /tmp/galgame
          git -C /tmp/galgame checkout --quiet fa34344a1cff46025e8d169f56411e290e9fafbd
      - name: Export unchanged original story and verify all links
        run: |
          node MayOS_0.3.0-pre1/native-game/export-story.js /tmp/galgame/site/story.js MayOS_0.3.0-pre1/native-game/story_data.h
      - name: Compile native engine with strict warnings and run regression tests
        run: |
          cd MayOS_0.3.0-pre1/native-game
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -I. engine.c qa/test-engine.c -o /tmp/summer-native-test
          /tmp/summer-native-test
      - name: Test with address and undefined-behavior sanitizers
        run: |
          cd MayOS_0.3.0-pre1/native-game
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -I. engine.c qa/test-engine.c -o /tmp/summer-sanitized
          /tmp/summer-sanitized
      - name: Compile and test native rendering, animation, and PCM audio
        run: |
          cd MayOS_0.3.0-pre1/native-game
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -I. render.c audio.c qa/test-media.c -lm -o /tmp/summer-media-test
          /tmp/summer-media-test
      - name: Media runtime sanitizer checks
        run: |
          cd MayOS_0.3.0-pre1/native-game
          gcc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -I. render.c audio.c qa/test-media.c -lm -o /tmp/summer-media-sanitized
          /tmp/summer-media-sanitized
      - name: Install native WebP development library
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libwebp-dev
      - name: Decode and validate all twelve unmodified original WebP files
        run: |
          cd MayOS_0.3.0-pre1/native-game
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -I. webp.c qa/test-webp.c -lwebp -o /tmp/summer-webp-test
          /tmp/summer-webp-test /tmp/galgame/site
      - name: Test persistent native save files and tamper detection
        run: |
          cd MayOS_0.3.0-pre1/native-game
          gcc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -I. engine.c storage.c qa/test-storage.c -o /tmp/summer-storage-test
          /tmp/summer-storage-test
