name: Export exact settings source for offline preview

on:
  push:
    branches:
      - feat/settings-personalization-persistence-and-video-20261111
    paths:
      - '.github/workflows/export-settings-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact source files without installing packages
        run: |
          mkdir -p preview-src
          cp MayOS_0.3.0-pre1/kernel/gui.c preview-src/gui.c
          cp MayOS_0.3.0-pre1/kernel/fs.c preview-src/fs.c
          cp MayOS_0.3.0-pre1/kernel/core.h preview-src/core.h
          git rev-parse HEAD > preview-src/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MayOS-settings-preview-source-${{ github.sha }}
          retention-days: 7
          path: preview-src/
