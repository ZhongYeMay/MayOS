name: Build and verify MayOS native prerelease

on:
  push:
    branches: [release/mayos-0.5.0-pre2]
    paths-ignore: ['.github/workflows/publish-native-050-pre2.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-iso:
    if: github.repository == 'ZhongYeMay/MayOS'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install firmware, ISO and QEMU tools
        run: |
          bash scripts/configure-ci-apt-mirror.sh
          sudo apt-get install -y --no-install-recommends gcc binutils grub-common \
            grub-pc-bin grub-efi-amd64-bin xorriso mtools qemu-system-x86 ovmf \
            python3-pil fonts-noto-cjk fonts-dejavu-core
      - name: Test the release ISO on BIOS and UEFI
        working-directory: MayOS_0.3.0-pre1
        run: |
          python3 scripts/test_ui_style_contract.py
          make -j2 all
          make test
          python3 scripts/uefi_smoke.py --custom-only --iso build/mayos.iso
      - name: Package the tested ISO
        run: |
          set -euo pipefail
          version="$(< MayOS_0.3.0-pre1/VERSION)"
          test "$version" = "0.5.0-pre2"
          mkdir dist
          stem="MayOS-$version"
          cp MayOS_0.3.0-pre1/build/mayos.iso "dist/$stem-MayKernel-x86_64.iso"
          cp MayOS_0.3.0-pre1/build/desktop.png "dist/$stem-desktop-QEMU.png"
          git archive --format=zip --output="dist/$stem-source.zip" HEAD
          cd dist
          sha256sum *.iso *.png *.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mayos-native-prerelease
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mayos-prerelease-qemu-logs
          path: MayOS_0.3.0-pre1/build/*.log
