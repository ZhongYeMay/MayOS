name: Build and publish MayOS 0.4.0 stable ISO

on:
  push:
    branches: [develop/mayos-0.4.0]
    paths: ['MayOS_0.3.0-pre1/VERSION']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mayos-stable-040
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.version.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        id: version
        run: |
          if [ "$(cat MayOS_0.3.0-pre1/VERSION)" = "0.4.0" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Still a prerelease; publication disabled."
          fi
  release:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse to overwrite a historical Release
        run: |
          ! gh release view v0.4.0 >/dev/null 2>&1
          test "$(cat MayOS_0.3.0-pre1/VERSION)" = "0.4.0"
          grep -q '^#define MAYOS_RELEASE "0.4.0"$' MayOS_0.3.0-pre1/kernel/gui.c
      - name: Install exact build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools dosfstools \
            qemu-system-x86 ovmf python3 python3-pil fonts-noto-cjk fonts-dejavu-core \
            flex bison bc libelf-dev libssl-dev xz-utils busybox-static musl-tools \
            rsync dpkg-dev
      - name: Build and run MayKernel GUI, filesystem and networking regressions
        working-directory: MayOS_0.3.0-pre1
        run: |
          set -euxo pipefail
          make all
          grep -q '^#define MAYOS_MATERIAL_ICONS 1
          make test-net
          make test-material
      - name: Build Linux 7.3.1 dual-kernel ISO
        working-directory: MayOS_0.3.0-pre1
        run: |
          make dual LINUX_VERSION=7.3.1 LINUX_JOBS=4
          grep -q '^#define MAYOS_MATERIAL_ICONS 1
      - name: Verify BIOS, Linux DHCP and UEFI boot matrix
        working-directory: MayOS_0.3.0-pre1
        run: |
          set -euxo pipefail
          make test-dual LINUX_VERSION=7.3.1
          make test-uefi LINUX_VERSION=7.3.1
      - name: Package verified ISO images
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp MayOS_0.3.0-pre1/build/mayos-dual.iso dist/MayOS-0.4.0-dual-boot.iso
          cp MayOS_0.3.0-pre1/build/mayos.iso dist/MayOS-0.4.0-MayKernel.iso
          cp MayOS_0.3.0-pre1/build/desktop.png dist/MayOS-0.4.0-desktop.png
          (cd dist && sha256sum *.iso > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          test -s MayOS_0.3.0-pre1/build/linux/downloads/linux-7.3.1.tar.xz
      - name: Package corresponding MayOS, Linux, and BusyBox source
        run: |
          set -euxo pipefail
          mkdir -p /tmp/mayos-040-source/MayOS /tmp/mayos-040-source/upstream
          git archive HEAD | tar -xf - -C /tmp/mayos-040-source/MayOS
          cp MayOS_0.3.0-pre1/build/linux/downloads/linux-7.3.1.tar.xz /tmp/mayos-040-source/upstream/
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          (cd /tmp/mayos-040-source/upstream && apt-get source busybox)
          tar -C /tmp -czf dist/MayOS-0.4.0-sources.tar.gz mayos-040-source
          test -s dist/MayOS-0.4.0-sources.tar.gz
          (cd dist && sha256sum MayOS-0.4.0-sources.tar.gz >> SHA256SUMS.txt)
      - name: Prepare release notes
        run: |
          cat > dist/RELEASE_NOTES.md <<'EOF'
          # MayOS 0.4.0

          Experimental dual-kernel desktop: MayKernel x86 and Linux 7.3.1 x86_64.

          - Native Material 3-style neutral desktop with macOS-like top bar and Dock.
          - App launcher/search, window overview, notifications, quick settings,
            context menus, real clock, brightness and native file interaction.
          - MayKernel RTL8139 IPv4 with DHCP, ARP, Ping, DNS and basic TCP/HTTP/1.0
            text transport using numeric IP hosts.
          - Linux e1000 DHCP/DNS and HTTP text preview, BIOS/UEFI QEMU validation.

          Limits: CPU framebuffer, 1024x768, no audio mixer, GPU acceleration,
          Wi-Fi manager, HTTPS, Secure Boot, arbitrary hardware or full TCP API.
          Linux desktop files remain RAM-only, whereas native MayFS persists.

          Includes two ISO images, SHA256SUMS and corresponding source bundle.
          QEMU-only experimental build, not recommended for production computers.
          EOF
      - name: Preserve the validated Release archive
        uses: actions/upload-artifact@v4
        with:
          name: MayOS-0.4.0-verified-release
          path: dist/
          retention-days: 30
      - name: Publish only the exact tested source and ISO
        run: |
          set -euo pipefail
          ! gh release view v0.4.0 >/dev/null 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/tags/v0.4.0 >/dev/null 2>&1; then
            test "$(git rev-list -n 1 v0.4.0)" = "$GITHUB_SHA"
          else
            git tag -a v0.4.0 -m "Tested MayOS 0.4.0"
            git push origin refs/tags/v0.4.0
          fi
          gh release create v0.4.0 \
            dist/MayOS-0.4.0-dual-boot.iso \
            dist/MayOS-0.4.0-MayKernel.iso \
            dist/MayOS-0.4.0-desktop.png \
            dist/MayOS-0.4.0-sources.tar.gz \
            dist/SHA256SUMS.txt \
            --title "MayOS 0.4.0" --notes-file dist/RELEASE_NOTES.md --latest
 build/material_icons.h
          make test
          make test-net
          make test-material
      - name: Build Linux 7.3.1 dual-kernel ISO
