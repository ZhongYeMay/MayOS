name: Verify MayOS 0.4.0-pre3 browser and dual-kernel desktop

on:
  push:
    branches:
      - develop/mayos-0.4.0-browser-pre3
    paths:
      - 'MayOS_0.3.0-pre1/**'
      - '.github/workflows/verify-mayos-browser-pre3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mayos-browser-pre3
  cancel-in-progress: true

jobs:
  maykernel:
    name: MayKernel GUI, network and browser integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU, native toolchain and icon prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools \
            qemu-system-x86 python3 python3-pil fonts-noto-cjk fonts-dejavu-core
      - name: Build MayOS 0.4.0-pre3 native ISO and Material icons
        working-directory: MayOS_0.3.0-pre1
        run: |
          set -euo pipefail
          make all
          test "$(cat VERSION)" = '0.4.0-pre3'
          grep -q '^#define MAYOS_RELEASE "0.4.0-pre3"$' kernel/gui.c
          grep -q '^#define MAYOS_MATERIAL_ICONS 1$' build/material_icons.h
      - name: Existing GUI, editor, MayFS, RTL8139 and pre2 regressions
        working-directory: MayOS_0.3.0-pre1
        run: |
          make test
          make test-net
          make test-material
          make test-pre2
      - name: Unit and live QEMU HTTP browser regression
        working-directory: MayOS_0.3.0-pre1
        run: make test-browser
      - name: Preserve real browser screenshots, serial logs and ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MayOS-0.4.0-pre3-browser-native
          path: |
            MayOS_0.3.0-pre1/build/mayos.iso
            MayOS_0.3.0-pre1/build/*.png
            MayOS_0.3.0-pre1/build/*.log
          if-no-files-found: warn
          retention-days: 30

  dual:
    name: Linux 7.3.1 and MayKernel BIOS plus UEFI tests
    needs: maykernel
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux, QEMU and UEFI build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools dosfstools \
            qemu-system-x86 ovmf python3 python3-pil fonts-noto-cjk \
            fonts-dejavu-core flex bison bc libelf-dev libssl-dev \
            xz-utils busybox-static musl-tools rsync
      - name: Build MayOS pre3 dual-kernel ISO
        working-directory: MayOS_0.3.0-pre1
        run: make dual LINUX_VERSION=7.3.1 LINUX_JOBS=4
      - name: Test BIOS Linux DHCP, native network and file isolation
        working-directory: MayOS_0.3.0-pre1
        run: make test-dual LINUX_VERSION=7.3.1
      - name: Test MayKernel and Linux UEFI QEMU desktop boot
        working-directory: MayOS_0.3.0-pre1
        run: make test-uefi LINUX_VERSION=7.3.1
      - name: Verify dual ISO checksum
        working-directory: MayOS_0.3.0-pre1
        run: |
          cd build
          sha256sum mayos-dual.iso > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Preserve fully tested dual-kernel ISO
        uses: actions/upload-artifact@v4
        with:
          name: MayOS-0.4.0-pre3-dual-verified
          path: |
            MayOS_0.3.0-pre1/build/mayos-dual.iso
            MayOS_0.3.0-pre1/build/SHA256SUMS.txt
          retention-days: 30
