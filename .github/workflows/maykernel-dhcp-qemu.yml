name: MayKernel DHCP QEMU integration

on:
  pull_request:
    paths:
      - 'MayOS_0.3.0-pre1/kernel/net*.c'
      - 'MayOS_0.3.0-pre1/kernel/net*.h'
      - 'MayOS_0.3.0-pre1/tests/net_dhcp_test.c'
      - 'MayOS_0.3.0-pre1/kernel/security_*.c'
      - 'MayOS_0.3.0-pre1/kernel/security_*.h'
      - 'MayOS_0.3.0-pre1/scripts/tls_smoke.py'
      - 'MayOS_0.3.0-pre1/scripts/net_smoke.py'
      - 'MayOS_0.3.0-pre1/Makefile'
      - 'scripts/configure-ci-apt-mirror.sh'
      - '.github/workflows/maykernel-dhcp-qemu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dhcp-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Choose verified signed Ubuntu apt archive
        run: bash scripts/configure-ci-apt-mirror.sh
      - name: Install QEMU and GRUB build tools
        run: |
          sudo apt-get install -y --no-install-recommends \
            gcc binutils make python3 python3-pil fonts-noto-cjk \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools \
            qemu-system-x86
      - name: Boot actual MayKernel and verify DHCP and network packets
        run: |
          make -C MayOS_0.3.0-pre1 test-net
      - name: Upload true QEMU framebuffer and serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-maykernel-dhcp-qemu
          if-no-files-found: warn
          retention-days: 30
          path: |
            MayOS_0.3.0-pre1/build/maykernel-rtl8139-*.png
            MayOS_0.3.0-pre1/build/maykernel-rtl8139-*.log
            MayOS_0.3.0-pre1/build/maykernel-rtl8139-*.sock-qemu.log
