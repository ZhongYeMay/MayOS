name: MayKernel Rust C hybrid native acceptance
on:
  pull_request:
    paths:
      - 'MayOS_0.3.0-pre1/rust/**'
      - 'MayOS_0.3.0-pre1/kernel/rust_bridge.h'
      - 'MayOS_0.3.0-pre1/kernel/update.c'
      - 'MayOS_0.3.0-pre1/scripts/rust_smoke.py'
      - 'MayOS_0.3.0-pre1/scripts/rust_video.py'
      - 'MayOS_0.3.0-pre1/scripts/rust_bearssl_smoke.py'
      - 'MayOS_0.3.0-pre1/Makefile'
      - '.github/workflows/maykernel-rust-hybrid.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-unit-and-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust compiler and bare-metal target
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target x86_64-unknown-none
          rustup default 1.85.1
          rustc -vV
      - name: Rust unit tests for untrusted manifest validation
        run: make -C MayOS_0.3.0-pre1 test-rust-host
      - name: Compile real Rust no_std static library for MayKernel
        run: |
          make -C MayOS_0.3.0-pre1 MAYOS_RUST=1 build/libmaykernel_rust.a
          nm -g MayOS_0.3.0-pre1/build/libmaykernel_rust.a | grep -E ' (T|t) mayrs_manifest_gate$'
          echo 'PASS: Rust no_std ABI symbol is present in native ELF64 archive'
  rust-c-qemu:
    runs-on: ubuntu-24.04
    needs: rust-unit-and-target
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust compiler/target
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target x86_64-unknown-none
          rustup default 1.85.1
      - name: Install signed Ubuntu QEMU and GRUB packages
        run: |
          bash scripts/configure-ci-apt-mirror.sh
          sudo apt-get install -y --no-install-recommends \
            gcc binutils make python3 python3-pil fonts-noto-cjk \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools qemu-system-x86 ffmpeg
      - name: Build actual Rust+C MayKernel and run two MayFS boot scenarios
        run: |
          make -C MayOS_0.3.0-pre1 MAYOS_RUST=1 test-rust-qemu
          nm -g MayOS_0.3.0-pre1/build/mayos.elf | grep ' mayrs_manifest_gate$'
      - name: Capture actual Rust C kernel QEMU screen and encode test MP4
        run: make -C MayOS_0.3.0-pre1 MAYOS_RUST=1 test-rust-video
      - name: Upload actual Rust C kernel screen captures and serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maykernel-rust-c-qemu-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            MayOS_0.3.0-pre1/build/maykernel-rust-*.png
            MayOS_0.3.0-pre1/build/maykernel-rust-*.log
            MayOS_0.3.0-pre1/build/maykernel-rust-*-qemu.log
            MayOS_0.3.0-pre1/build/MayOS-Rust-C-native-QEMU-test.mp4
            MayOS_0.3.0-pre1/build/rust-video-*.log
  rust-bearssl-coexist:
    runs-on: ubuntu-24.04
    needs: rust-c-qemu
    timeout-minutes: 25
    env:
      BEARSSL_PIN: 79c060eea3eea1257797f15ea1608a9a9923aa6f
    steps:
      - uses: actions/checkout@v4
      - name: Install same pinned Rust bare-metal target
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target x86_64-unknown-none
          rustup default 1.85.1
      - name: Install signed Ubuntu build and QEMU packages
        run: |
          bash scripts/configure-ci-apt-mirror.sh
          sudo apt-get install -y --no-install-recommends \
            gcc binutils make python3 python3-pil fonts-noto-cjk \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools qemu-system-x86
      - name: Check out exact official upstream BearSSL snapshot
        run: |
          git clone --quiet https://www.bearssl.org/git/BearSSL vendor/bearssl
          git -C vendor/bearssl checkout -q --detach "$BEARSSL_PIN"
          test "$(git -C vendor/bearssl rev-parse HEAD)" = "$BEARSSL_PIN"
      - name: Boot actual Rust C BearSSL hybrid kernel; HTTPS must remain blocked
        run: |
          make -C MayOS_0.3.0-pre1 MAYOS_RUST=1 \
            BEARSSL_SOURCE="$GITHUB_WORKSPACE/vendor/bearssl" test-rust-bearssl-qemu
          nm -g MayOS_0.3.0-pre1/build/mayos.elf | grep ' mayrs_manifest_gate$'
          nm -g MayOS_0.3.0-pre1/build/mayos.elf | grep ' br_ssl_client_init_full$'
      - name: Upload genuine mixed-language native QEMU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maykernel-rust-c-bearssl-qemu-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            MayOS_0.3.0-pre1/build/maykernel-rust-bearssl-*.png
            MayOS_0.3.0-pre1/build/maykernel-rust-bearssl-*.log
            MayOS_0.3.0-pre1/build/maykernel-rust-bearssl-*-qemu.log
