name: MayKernel Ed25519 authenticated 64KiB HTTP stream QEMU
on:
  pull_request:
    paths:
      - 'MayOS_0.3.0-pre1/kernel/update.c'
      - 'MayOS_0.3.0-pre1/kernel/update.h'
      - 'MayOS_0.3.0-pre1/kernel/gui.c'
      - 'MayOS_0.3.0-pre1/kernel/update_stream_integrity.*'
      - 'MayOS_0.3.0-pre1/scripts/signed_stream_smoke.py'
      - 'MayOS_0.3.0-pre1/Makefile'
      - '.github/workflows/maykernel-signed-stream-qemu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-real-qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust toolchain and install signed QEMU dependencies
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target x86_64-unknown-none
          rustup default 1.85.1
          bash scripts/configure-ci-apt-mirror.sh
          sudo apt-get install -y --no-install-recommends \
            gcc binutils make python3 python3-pil fonts-noto-cjk openssl \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools qemu-system-x86
      - name: Generate ephemeral test key and two genuinely signed 64KiB images
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm Ed25519 -out "$RUNNER_TEMP/signed-stream-secret.pem"
          openssl pkey -in "$RUNNER_TEMP/signed-stream-secret.pem" -pubout -outform DER \
            -out "$RUNNER_TEMP/signed-stream-public.der"
          python3 - <<'PY'
          from pathlib import Path
          import os
          temp=Path(os.environ["RUNNER_TEMP"])
          public=(temp/"signed-stream-public.der").read_bytes()
          prefix=bytes.fromhex("302a300506032b6570032100")
          assert len(public)==44 and public.startswith(prefix)
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write("MAYOS_SIGNED_STREAM_PUBHEX="+public[12:].hex()+"\n")
          payload=bytes((((i*13)^(i>>5)^0xa5)&255) for i in range(65536))
          (temp/"valid-64k.bin").write_bytes(payload)
          corrupted=bytearray(payload)
          corrupted[16000]^=0x20
          (temp/"wrong-hash-64k.bin").write_bytes(corrupted)
          PY
          python3 MayOS_0.3.0-pre1/scripts/package_signed_release.py \
            --image "$RUNNER_TEMP/valid-64k.bin" \
            --private-key "$RUNNER_TEMP/signed-stream-secret.pem" \
            --output-dir "$RUNNER_TEMP/signed-stream-valid" \
            --version 0.5.0-pre3 --date 2026-11-21 \
            --eta-minutes 6 --changelog 'Native signed stream fixture'
          python3 MayOS_0.3.0-pre1/scripts/package_signed_release.py \
            --image "$RUNNER_TEMP/wrong-hash-64k.bin" \
            --private-key "$RUNNER_TEMP/signed-stream-secret.pem" \
            --output-dir "$RUNNER_TEMP/signed-stream-wrong-hash" \
            --version 0.5.0-pre3 --date 2026-11-21 \
            --eta-minutes 6 --changelog 'Native signed stream wrong digest'
      - name: Build actual x86_64 RustCrypto Ed25519 + Rust+C SHA-256 kernel
        shell: bash
        run: |
          set -euo pipefail
          make -C MayOS_0.3.0-pre1 MAYOS_SIGNED_STREAM_DIAGNOSTIC=1 \
            MAYOS_RELEASE_PUBKEY_HEX="$MAYOS_SIGNED_STREAM_PUBHEX" all
          nm -g MayOS_0.3.0-pre1/build/mayos.elf | grep ' mayrs_ed25519_verify$'
          nm -g MayOS_0.3.0-pre1/build/mayos.elf | grep ' may_update_stream_feed$'
      - name: Native QEMU signed real stream, corrupt signature and wrong digest
        run: |
          python3 MayOS_0.3.0-pre1/scripts/signed_stream_smoke.py \
            --package-dir "$RUNNER_TEMP/signed-stream-valid" \
            --wrong-hash-package-dir "$RUNNER_TEMP/signed-stream-wrong-hash"
      - name: Upload authentic QEMU framebuffer, logs only; no private key
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maykernel-ed25519-signed-stream-native-qemu
          retention-days: 30
          if-no-files-found: warn
          path: |
            MayOS_0.3.0-pre1/build/signed-stream-*.png
            MayOS_0.3.0-pre1/build/signed-stream-*.log
            MayOS_0.3.0-pre1/build/signed-stream-*-qemu.log
