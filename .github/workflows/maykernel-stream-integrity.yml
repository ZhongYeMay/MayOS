name: MayKernel Rust+C native stream SHA256 integrity
on:
  pull_request:
    paths:
      - 'MayOS_0.3.0-pre1/kernel/update_stream_integrity.*'
      - 'MayOS_0.3.0-pre1/kernel/rust_bridge.h'
      - 'MayOS_0.3.0-pre1/kernel/gui.c'
      - 'MayOS_0.3.0-pre1/tests/update_stream_integrity_test.c'
      - 'MayOS_0.3.0-pre1/scripts/stream_integrity_smoke.py'
      - 'MayOS_0.3.0-pre1/Makefile'
      - '.github/workflows/maykernel-stream-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Native C exact SHA-256 and hostile stream test
        run: make -C MayOS_0.3.0-pre1 test-stream-integrity
      - name: Test actual no_std Rust HTTP byte budget
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          make -C MayOS_0.3.0-pre1 test-rust-host
  real-qemu:
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pin bare metal Rust target
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target x86_64-unknown-none
          rustup default 1.85.1
      - name: Install QEMU build tools
        run: |
          bash scripts/configure-ci-apt-mirror.sh
          sudo apt-get install -y --no-install-recommends \
            gcc binutils make python3 python3-pil fonts-noto-cjk \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools qemu-system-x86
      - name: Boot actual Rust+C MayKernel and run stream digest self-test
        run: make -C MayOS_0.3.0-pre1 MAYOS_RUST=1 test-stream-integrity-qemu
      - name: Preserve real framebuffer and serial console
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maykernel-stream-digest-qemu
          retention-days: 30
          if-no-files-found: warn
          path: |
            MayOS_0.3.0-pre1/build/maykernel-stream-integrity.png
            MayOS_0.3.0-pre1/build/maykernel-stream-integrity-*.log
