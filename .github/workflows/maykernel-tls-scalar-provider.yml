name: MayKernel SSE-safe portable BearSSL cipher policy
on:
  pull_request:
    paths:
      - 'MayOS_0.3.0-pre1/kernel/security_tls_provider.c'
      - 'MayOS_0.3.0-pre1/kernel/security_tls_provider.h'
      - 'MayOS_0.3.0-pre1/kernel/gui.c'
      - 'MayOS_0.3.0-pre1/scripts/tls_provider_smoke.py'
      - '.github/workflows/maykernel-tls-scalar-provider.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  BEARSSL_PIN: 79c060eea3eea1257797f15ea1608a9a9923aa6f
jobs:
  native-portable-bearssl:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and GRUB packages
        run: |
          bash scripts/configure-ci-apt-mirror.sh
          sudo apt-get install -y --no-install-recommends \
            gcc binutils make python3 python3-pil fonts-noto-cjk \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools qemu-system-x86
      - name: Pin upstream BearSSL source
        run: |
          git clone --quiet https://www.bearssl.org/git/BearSSL vendor/bearssl
          git -C vendor/bearssl checkout -q --detach "$BEARSSL_PIN"
          test "$(git -C vendor/bearssl rev-parse HEAD)" = "$BEARSSL_PIN"
      - name: Native QEMU prove scalar ciphers configured while HTTPS stays blocked
        run: |
          make -C MayOS_0.3.0-pre1 BEARSSL_SOURCE="$GITHUB_WORKSPACE/vendor/bearssl" test-bearssl-qemu
          nm -g MayOS_0.3.0-pre1/build/mayos.elf | grep ' may_tls_provider_scalar_only$'
      - name: Preserve genuine QEMU screenshot/serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maykernel-portable-bearssl-without-sse-qemu
          retention-days: 30
          if-no-files-found: warn
          path: |
            MayOS_0.3.0-pre1/build/maykernel-bearssl-*.png
            MayOS_0.3.0-pre1/build/maykernel-bearssl-*.log
