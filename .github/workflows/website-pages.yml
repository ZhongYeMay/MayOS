name: MayOS Website · verify and publish
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      pages_enabled: ${{ steps.pagescheck.outputs.enabled }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check HTML links and truthful release status
        run: python3 website/check_site.py
      - name: Check whether GitHub Pages has been enabled
        id: pagescheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Website verified, but GitHub Pages is not enabled. Set Settings > Pages > Source to GitHub Actions, then rerun this workflow." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish a standalone website artifact
        uses: actions/upload-artifact@v4
        with:
          name: mayos-website-source
          path: website/
          retention-days: 14
  deploy:
    if: needs.verify.outputs.pages_enabled == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
