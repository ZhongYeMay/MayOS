name: Increment MayOS prerelease version

# Development pushes remain unversioned; release preparation is a deliberate action.
on:
  workflow_dispatch:
    inputs:
      summary:
        description: "Summarize the batch of meaningful improvements being prepared"
        required: true
        type: string
      confirm:
        description: "Confirm the development batch is ready for the next preN version"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mayos-prerelease-version
  cancel-in-progress: false

jobs:
  increment:
    if: github.repository == 'ZhongYeMay/MayOS' && github.ref == 'refs/heads/main' && inputs.confirm == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Prepare one prerelease version after accumulated improvements
        env:
          RELEASE_SUMMARY: ${{ inputs.summary }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          if [ -z "${RELEASE_SUMMARY//[[:space:]]/}" ]; then
            echo "A meaningful release summary is required" >&2
            exit 1
          fi
          python3 - <<'PY'
          import pathlib, re
          version_file = pathlib.Path("MayOS_0.3.0-pre1/VERSION")
          gui_file = pathlib.Path("MayOS_0.3.0-pre1/kernel/gui.c")
          version = version_file.read_text().strip()
          prerelease = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)-pre(\d+)", version)
          stable = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
          if prerelease:
              base = f"{prerelease.group(1)}.{prerelease.group(2)}.{prerelease.group(3)}"
              next_number = int(prerelease.group(4)) + 1
          elif stable:
              # Stable releases stay immutable; start the next patch prerelease.
              base = f"{stable.group(1)}.{stable.group(2)}.{int(stable.group(3)) + 1}"
              next_number = 1
          else:
              raise SystemExit("Unexpected VERSION format: " + version)
          next_version = f"{base}-pre{next_number}"
          source = gui_file.read_text()
          source, changed = re.subn(r'#define MAYOS_RELEASE "\d+\.\d+\.\d+(?:-pre\d+)?"',
                                    f'#define MAYOS_RELEASE "{next_version}"', source, count=1)
          if changed != 1:
              raise SystemExit("Could not locate MayOS GUI version constant")
          gui_file.write_text(source)
          version_file.write_text(next_version + "\n")
          for relative in ("kernel/fs.c", "scripts/linux.py"):
              path = version_file.parent / relative
              source = path.read_text()
              source = re.sub(r'(MayOS (?:Linux Live )?)\d+\.\d+\.\d+(?:-pre\d+)?',
                              lambda m: m.group(1) + next_version, source)
              source = re.sub(r'VERSION="\d+\.\d+\.\d+(?:-pre\d+)?"',
                              f'VERSION="{next_version}"', source)
              path.write_text(source)
          print("Advanced MayOS version:", version, "->", next_version)
          PY
          git add MayOS_0.3.0-pre1/VERSION MayOS_0.3.0-pre1/kernel/gui.c MayOS_0.3.0-pre1/kernel/fs.c MayOS_0.3.0-pre1/scripts/linux.py
          git commit -m "chore(version): increment MayOS prerelease [skip ci]"
          git push origin HEAD:main
