name: Increment MayOS prerelease version

on:
  push:
    branches:
      - main
      - develop/mayos-0.4.0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mayos-prerelease-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  increment:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Advance pre number on development commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin "$BRANCH_NAME"
          VERSION_FILE=MayOS_0.3.0-pre1/VERSION
          if grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+$' "$VERSION_FILE"; then
            echo 'Stable release source; do not increment it.'
            exit 0
          fi
          count=1
          if [[ "$EVENT_NAME" == push ]] && [[ "$BEFORE_SHA" =~ ^[[:xdigit:]]{40}$ ]] && [[ "$AFTER_SHA" =~ ^[[:xdigit:]]{40}$ ]]; then
            if [[ "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
              count="$(git rev-list --count "$BEFORE_SHA..$AFTER_SHA")"
            fi
          fi
          if (( count < 1 || count > 100 )); then
            echo "Unreasonable commit count: $count" >&2
            exit 1
          fi
          COUNT="$count" python3 - <<'PY'
          import os, pathlib, re
          version_file = pathlib.Path('MayOS_0.3.0-pre1/VERSION')
          gui_file = pathlib.Path('MayOS_0.3.0-pre1/kernel/gui.c')
          version = version_file.read_text().strip()
          match = re.fullmatch(r'(\d+\.\d+\.\d+)-pre(\d+)', version)
          if not match:
              raise SystemExit('Invalid prerelease version: ' + version)
          new_version = f'{match.group(1)}-pre{int(match.group(2)) + int(os.environ["COUNT"])}'
          source = gui_file.read_text()
          source, changed = re.subn(
              r'^#define MAYOS_RELEASE "\d+\.\d+\.\d+-pre\d+"$',
              f'#define MAYOS_RELEASE "{new_version}"',
              source, count=1, flags=re.M)
          if changed != 1:
              raise SystemExit('GUI version declaration not found')
          gui_file.write_text(source)
          version_file.write_text(new_version + '\n')
          print('MayOS:', version, '->', new_version)
          PY
          git add "$VERSION_FILE" MayOS_0.3.0-pre1/kernel/gui.c
          if git diff --cached --quiet; then
            echo 'No version change needed'
            exit 0
          fi
          git commit -m 'chore: advance MayOS prerelease [skip ci]'
          git push origin "HEAD:$BRANCH_NAME"
