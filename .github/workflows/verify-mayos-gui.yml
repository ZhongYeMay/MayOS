name: Verify MayOS GUI

on:
  push:
    branches: [main]
    paths:
      - 'MayOS_0.3.0-pre1/kernel/gui.c'
      - '.github/workflows/verify-mayos-gui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib \
            grub-pc-bin grub-common xorriso mtools qemu-system-x86 python3-pil
      - name: Build custom kernel ISO and run GUI smoke tests
        working-directory: MayOS_0.3.0-pre1
        run: |
          make all
          make test
