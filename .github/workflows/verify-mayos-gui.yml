name: Verify MayOS GUI

on:
  push:
    branches: [main]
    paths:
      - 'MayOS_0.3.0-pre1/kernel/gui.c'
      - 'MayOS_0.3.0-pre1/scripts/ui_smoke.py'
      - '.github/workflows/verify-mayos-gui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-gui:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools \
            qemu-system-x86 python3-pil fonts-noto-cjk fonts-dejavu-core
      - name: Check required bitmap font sources
        run: |
          set -eu
          test -s /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
          test -s /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf
          python3 -c 'from PIL import Image, ImageFont; print("Pillow and system fonts ready")'
      - name: Build custom kernel ISO
        working-directory: MayOS_0.3.0-pre1
        run: |
          set -euxo pipefail
          make all
      - name: Run QEMU desktop smoke tests
        working-directory: MayOS_0.3.0-pre1
        run: make test
      - name: Upload real QEMU desktop screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MayOS-graphite-GUI-screenshots
          path: |
            MayOS_0.3.0-pre1/build/desktop.png
            MayOS_0.3.0-pre1/build/dark-settings.png
            MayOS_0.3.0-pre1/build/light-settings.png
            MayOS_0.3.0-pre1/build/files.png
            MayOS_0.3.0-pre1/build/terminal.png
          if-no-files-found: warn
          retention-days: 30
      - name: Publish verified desktop screenshot to website
        if: success() && github.ref == 'refs/heads/main'
        run: |
          set -eu
          test -s MayOS_0.3.0-pre1/build/desktop.png
          mkdir -p website/media
          cp MayOS_0.3.0-pre1/build/desktop.png website/media/MayOS-latest-desktop.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/media/MayOS-latest-desktop.png
          if git diff --cached --quiet; then
            echo "Screenshot unchanged"
            exit 0
          fi
          git commit -m "Publish verified MayOS desktop screenshot [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
