name: MayKernel HTTP body budget and ATA flush regression
on:
  pull_request:
    paths:
      - 'MayOS_0.3.0-pre1/rust/maykernel_policy/src/http_body_budget.rs'
      - 'MayOS_0.3.0-pre1/rust/maykernel_policy/src/lib.rs'
      - 'MayOS_0.3.0-pre1/kernel/update_stage_disk.c'
      - 'MayOS_0.3.0-pre1/kernel/gui.c'
      - 'MayOS_0.3.0-pre1/kernel/rust_bridge.h'
      - 'MayOS_0.3.0-pre1/scripts/http_body_budget_smoke.py'
      - 'MayOS_0.3.0-pre1/Makefile'
      - '.github/workflows/maykernel-http-body-budget.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust bare-metal compiler
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target x86_64-unknown-none
          rustup default 1.85.1
      - name: Exercise exact stream length and failure states
        run: make -C MayOS_0.3.0-pre1 test-rust-host
      - name: Validate Rust body budget in no_std static archive
        run: |
          make -C MayOS_0.3.0-pre1 MAYOS_RUST=1 build/libmaykernel_rust.a
          nm -g MayOS_0.3.0-pre1/build/libmaykernel_rust.a | grep ' mayrs_http_body_consume$'
  actual-qemu-body:
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pin Rust compiler and no_std target
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target x86_64-unknown-none
          rustup default 1.85.1
      - name: Install signed QEMU and GRUB build packages
        run: |
          bash scripts/configure-ci-apt-mirror.sh
          sudo apt-get install -y --no-install-recommends \
            gcc binutils make python3 python3-pil fonts-noto-cjk \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools qemu-system-x86
      - name: QEMU native HTTP budget diagnostic
        run: |
          make -C MayOS_0.3.0-pre1 MAYOS_RUST=1 test-http-budget-qemu
      - name: Save authentic MayKernel QEMU framebuffer and serial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maykernel-http-body-native-qemu
          retention-days: 30
          if-no-files-found: warn
          path: |
            MayOS_0.3.0-pre1/build/maykernel-http-body-*.png
            MayOS_0.3.0-pre1/build/maykernel-http-body-*.log
  actual-qemu-ata:
    needs: host-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust bare-metal target
        run: |
          rustup toolchain install 1.85.1 --profile minimal --target x86_64-unknown-none
          rustup default 1.85.1
      - name: Install signed QEMU and GRUB dependencies
        run: |
          bash scripts/configure-ci-apt-mirror.sh
          sudo apt-get install -y --no-install-recommends \
            gcc binutils make python3 python3-pil fonts-noto-cjk \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools qemu-system-x86
      - name: ATA 64KiB multiple reboot regression after DRQ completion fix
        run: |
          make -C MayOS_0.3.0-pre1 MAYOS_STAGE_DISK_DIAGNOSTIC=1 test-stage-qemu
      - name: Save true ATA QEMU evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maykernel-stage-ata-drq-regression
          retention-days: 30
          if-no-files-found: warn
          path: |
            MayOS_0.3.0-pre1/build/stage-*.png
            MayOS_0.3.0-pre1/build/stage-*.log
