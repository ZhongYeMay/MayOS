name: Verify MayOS 0.4.0-pre2 system

on:
  push:
    branches:
      - release/mayos-0.4.0-pre2
    paths:
      - 'MayOS_0.3.0-pre1/kernel/**'
      - 'MayOS_0.3.0-pre1/assets/**'
      - 'MayOS_0.3.0-pre1/scripts/**'
      - 'MayOS_0.3.0-pre1/Makefile'
      - 'MayOS_0.3.0-pre1/VERSION'
      - '.github/workflows/verify-mayos-040-pre2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mayos-040-pre2-validation
  cancel-in-progress: true

jobs:
  native:
    name: Verify native MayKernel GUI, cursor and networking
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools \
            qemu-system-x86 python3-pil fonts-noto-cjk fonts-dejavu-core
      - name: Compile MayKernel pre2 and licensed Material icons
        working-directory: MayOS_0.3.0-pre1
        run: |
          set -euo pipefail
          make all
          grep -q '^#define MAYOS_MATERIAL_ICONS 1$' build/material_icons.h
          grep -q '^#define MAYOS_RELEASE "0.4.0-pre2"$' kernel/gui.c
          test "$(cat VERSION)" = '0.4.0-pre2'
      - name: Native GUI, disk isolation and file system
        working-directory: MayOS_0.3.0-pre1
        run: make test
      - name: Live MayKernel DHCP, DNS, ICMP and HTTP
        working-directory: MayOS_0.3.0-pre1
        run: make test-net
      - name: Material Dock, panels and window controls
        working-directory: MayOS_0.3.0-pre1
        run: make test-material
      - name: Windows pointer and icon-only system status controls
        working-directory: MayOS_0.3.0-pre1
        run: make test-pre2
      - name: Upload native ISO, screenshots and serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MayOS-0.4.0-pre2-native
          path: |
            MayOS_0.3.0-pre1/build/mayos.iso
            MayOS_0.3.0-pre1/build/*.png
            MayOS_0.3.0-pre1/build/*.log
          if-no-files-found: warn
          retention-days: 30

  dual:
    name: Verify Linux + MayKernel BIOS/UEFI dual ISO
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build, QEMU and UEFI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools dosfstools \
            qemu-system-x86 ovmf python3 python3-pil \
            fonts-noto-cjk fonts-dejavu-core flex bison bc libelf-dev libssl-dev \
            xz-utils busybox-static musl-tools rsync
      - name: Build complete MayOS pre2 hybrid ISO
        working-directory: MayOS_0.3.0-pre1
        run: make dual LINUX_VERSION=7.3.1 LINUX_JOBS=4
      - name: Test Linux and MayKernel via BIOS
        working-directory: MayOS_0.3.0-pre1
        run: make test-dual LINUX_VERSION=7.3.1
      - name: Test both kernels via OVMF UEFI
        working-directory: MayOS_0.3.0-pre1
        run: make test-uefi LINUX_VERSION=7.3.1
      - name: Hash exact validated ISO files
        working-directory: MayOS_0.3.0-pre1
        run: |
          set -euo pipefail
          cd build
          sha256sum mayos-dual.iso > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Preserve validated dual-boot ISO and checksums
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MayOS-0.4.0-pre2-dual-verified
          path: |
            MayOS_0.3.0-pre1/build/mayos-dual.iso
            MayOS_0.3.0-pre1/build/SHA256SUMS.txt
          retention-days: 30
