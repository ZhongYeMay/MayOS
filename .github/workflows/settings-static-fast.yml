name: Fast settings / MayFS compiler checks (no apt)

on:
  pull_request:
    paths:
      - 'MayOS_0.3.0-pre1/kernel/gui.c'
      - 'MayOS_0.3.0-pre1/kernel/fs.c'
      - 'MayOS_0.3.0-pre1/kernel/core.h'
      - 'MayOS_0.3.0-pre1/scripts/settings_smoke.py'
      - 'MayOS_0.3.0-pre1/scripts/test_ui_style_contract.py'
      - 'MayOS_0.3.0-pre1/scripts/record_feature_tour.py'
      - '.github/workflows/settings-static-fast.yml'
  push:
    branches: [main]
    paths:
      - 'MayOS_0.3.0-pre1/kernel/gui.c'
      - 'MayOS_0.3.0-pre1/kernel/fs.c'
      - 'MayOS_0.3.0-pre1/kernel/core.h'
      - '.github/workflows/settings-static-fast.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Python scripts without network packages
        working-directory: MayOS_0.3.0-pre1
        run: |
          python3 -m py_compile scripts/settings_smoke.py scripts/record_feature_tour.py
          python3 scripts/test_ui_style_contract.py
      - name: Check x86_64 MayFS and GUI compilation against minimal generated headers
        working-directory: MayOS_0.3.0-pre1
        run: |
          mkdir -p build
          printf '#define FONT_COUNT 1\nstatic const unsigned short font_code[1]={65};\nstatic const unsigned char font_bits[1][320]={{0}};\n' > build/font.h
          printf '#define CAT_W 1\n#define CAT_H 1\nstatic const unsigned short cat_rgb565[1]={0};\n' > build/cat_image.h
          gcc -m64 -DMAYOS_X86_64 -std=gnu11 -O2 -Wall -Wextra -Werror \
            -ffreestanding -fno-builtin -mno-red-zone -mgeneral-regs-only \
            -Ibuild -Ikernel -fsyntax-only kernel/fs.c kernel/gui.c
