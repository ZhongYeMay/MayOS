name: Fast settings / MayFS compiler checks (no apt)

on:
  pull_request:
    paths:
      - 'MayOS_0.3.0-pre1/kernel/gui.c'
      - 'MayOS_0.3.0-pre1/scripts/font.py'
      - 'MayOS_0.3.0-pre1/kernel/fs.c'
      - 'MayOS_0.3.0-pre1/kernel/core.h'
      - 'MayOS_0.3.0-pre1/kernel/update_sha256.c'
      - 'MayOS_0.3.0-pre1/kernel/updater.c'
      - 'MayOS_0.3.0-pre1/linux/update_transport.c'
      - 'MayOS_0.3.0-pre1/linux/fetch.c'
      - 'MayOS_0.3.0-pre1/linux/desktop.c'
      - 'MayOS_0.3.0-pre1/scripts/modern_network.py'
      - 'MayOS_0.3.0-pre1/scripts/updater_test.c'
      - 'MayOS_0.3.0-pre1/scripts/test_updater.py'
      - 'MayOS_0.3.0-pre1/scripts/settings_smoke.py'
      - 'MayOS_0.3.0-pre1/scripts/test_ui_style_contract.py'
      - 'MayOS_0.3.0-pre1/scripts/record_feature_tour.py'
      - '.github/workflows/settings-static-fast.yml'
  push:
    branches: [main]
    paths:
      - 'MayOS_0.3.0-pre1/kernel/gui.c'
      - 'MayOS_0.3.0-pre1/scripts/font.py'
      - 'MayOS_0.3.0-pre1/kernel/fs.c'
      - 'MayOS_0.3.0-pre1/kernel/core.h'
      - 'MayOS_0.3.0-pre1/kernel/update_sha256.c'
      - 'MayOS_0.3.0-pre1/kernel/updater.c'
      - 'MayOS_0.3.0-pre1/linux/update_transport.c'
      - 'MayOS_0.3.0-pre1/linux/fetch.c'
      - 'MayOS_0.3.0-pre1/linux/desktop.c'
      - 'MayOS_0.3.0-pre1/scripts/modern_network.py'
      - 'MayOS_0.3.0-pre1/scripts/updater_test.c'
      - 'MayOS_0.3.0-pre1/scripts/test_updater.py'
      - '.github/workflows/settings-static-fast.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Python scripts without network packages
        working-directory: MayOS_0.3.0-pre1
        run: |
          python3 -m py_compile scripts/settings_smoke.py scripts/record_feature_tour.py
          python3 scripts/test_ui_style_contract.py
          python3 scripts/test_updater.py
      - name: Compile actual Linux HTTPS update worker without network access
        working-directory: MayOS_0.3.0-pre1
        run: |
          if pkg-config --exists libcurl; then
            gcc -std=c11 -O2 -Wall -Wextra -Werror -Ikernel \
              linux/fetch.c linux/update_transport.c kernel/update_sha256.c \
              $(pkg-config --cflags --libs libcurl) -o /tmp/mayos-update-check-worker
            /tmp/mayos-update-check-worker --capabilities
            set +e
            got="$(/tmp/mayos-update-check-worker --mayos-update-invalid 2>&1)"
            code=$?
            set -e
            printf 'Invalid-update request: exit=%s output=%s\n' "$code" "$got"
            test "$code" -eq 2
            test "$got" = "E|Unsupported system update request"
          else
            echo "SKIP: libcurl development headers absent in no-apt fast runner; dedicated TLS updater job performs required native build"
          fi
      - name: Dry-run website release promotion before any publishing
        run: |
          python3 scripts/promote_strict_ui_release_website.py
          python3 website/check_site.py
          git restore website
      - name: Check x86_64 MayFS and GUI compilation against minimal generated headers
        working-directory: MayOS_0.3.0-pre1
        run: |
          mkdir -p build
          printf '#define FONT_COUNT 1\nstatic const unsigned short font_code[1]={65};\nstatic const unsigned char font_bits[1][320]={{0}};\n#define PREMIUM_FONT_COUNT 1\nstatic const unsigned short premium_font_code[1]={65};\nstatic const unsigned char premium_title_advance[1]={12};\nstatic const unsigned char premium_body_advance[1]={8};\nstatic const unsigned char premium_title_bitmap[1][1440]={{0}};\nstatic const unsigned char premium_body_bitmap[1][840]={{0}};\n' > build/font.h
          printf '#define CAT_W 1\n#define CAT_H 1\nstatic const unsigned short cat_rgb565[1]={0};\n' > build/cat_image.h
          printf '#define MAYOS_MATERIAL_ICONS 0\n' > build/material_icons.h
          gcc -m64 -DMAYOS_X86_64 -std=gnu11 -O2 -Wall -Wextra -Werror \
            -ffreestanding -fno-builtin -mno-red-zone -mgeneral-regs-only \
            -Ibuild -Ikernel -fsyntax-only kernel/fs.c kernel/gui.c
