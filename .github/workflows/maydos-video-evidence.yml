name: Record MayOS legacy app demos (real QEMU)

on:
  pull_request:
    paths:
      - 'MayOS_0.3.0-pre1/kernel/maydos_**'
      - 'MayOS_0.3.0-pre1/kernel/gui.c'
      - 'MayOS_0.3.0-pre1/scripts/record_maydos_suite.py'
      - '.github/workflows/maydos-video-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maydos-real-video:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure signed runner package mirror
        run: bash scripts/configure-ci-apt-mirror.sh
      - name: Install QEMU, GRUB, FFmpeg, font and test dependencies
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=3 -o Acquire::ForceIPv4=true \
            build-essential gcc-multilib grub-common grub-pc-bin grub-efi-amd64-bin \
            xorriso mtools qemu-system-x86 python3-pil ffmpeg \
            fonts-noto-cjk fonts-dejavu-core
      - name: Build authentic MayKernel x86_64 GUI ISO
        working-directory: MayOS_0.3.0-pre1
        run: |
          make -j2 all
          python3 scripts/test_maydos_tools.py
          python3 scripts/maydos_smoke.py
      - name: Capture calculator, minesweeper, MayNote and extensions in QEMU
        working-directory: MayOS_0.3.0-pre1
        run: |
          mkdir -p build/recordings/maydos
          python3 scripts/record_maydos_suite.py \
            --iso build/mayos.iso \
            --output-dir build/recordings/maydos \
            --source-commit "$(git rev-parse HEAD)"
      - name: Verify five H264 MP4 assets
        working-directory: MayOS_0.3.0-pre1
        run: |
          set -eu
          for name in calculator minesweeper maynote extensions; do
            file="build/recordings/maydos/MayOS-legacy-$name-real-QEMU.mp4"
            test -s "$file"
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height \
              -of csv=p=0 "$file" | grep -Fx 'h264,1024,768'
            test -s "build/recordings/maydos/MayOS-legacy-$name-real-QEMU.json"
          done
          test -s build/recordings/maydos/MayOS-legacy-all-four-real-QEMU.mp4
          test -s build/recordings/maydos/MayOS-legacy-all-four-real-QEMU.json
      - name: Upload raw QEMU MayDOS MP4s, evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MayOS-legacy-four-functions-real-QEMU
          retention-days: 30
          if-no-files-found: warn
          path: |
            MayOS_0.3.0-pre1/build/recordings/maydos/*.mp4
            MayOS_0.3.0-pre1/build/recordings/maydos/*.json
            MayOS_0.3.0-pre1/build/recordings/maydos/*.ffmpeg.log
            MayOS_0.3.0-pre1/build/record-bios-custom.log
            MayOS_0.3.0-pre1/build/record-bios-custom-qemu.log
            MayOS_0.3.0-pre1/build/test-maydos.log
            MayOS_0.3.0-pre1/build/test-maydos-*.png
