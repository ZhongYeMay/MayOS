name: MayKernel native game QEMU evidence

on:
  push:
    branches: [main]
    paths:
      - 'MayOS_0.3.0-pre1/kernel/**'
      - 'MayOS_0.3.0-pre1/Makefile'
      - 'MayOS_0.3.0-pre1/scripts/**'
      - '.github/workflows/maykernel-game-qemu.yml'
  workflow_dispatch:

jobs:
  build-test-record:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ZhongYeMay/galgame
          ref: mayos-game-package
          path: source-galgame
          persist-credentials: false
      - name: Install ISO, cross-build, VM, font and recording tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential gcc-multilib grub-pc-bin grub-efi-amd64-bin \
            grub-common grub2-common xorriso mtools dosfstools \
            qemu-system-x86 python3 python3-pil ffmpeg \
            fonts-noto-cjk fonts-dejavu-core
      - name: Build original freestanding x86 MayKernel game into ISO
        run: |
          make -C MayOS_0.3.0-pre1 -j2 SUMMER_SITE=../source-galgame/site
          git -C source-galgame rev-parse HEAD > MayOS_0.3.0-pre1/build/summer-source-commit.txt
      - name: Record actual framebuffer from QEMU
        working-directory: MayOS_0.3.0-pre1
        run: |
          mkdir -p build/recordings
          python3 scripts/record_galgame.py \
            --iso build/mayos.iso \
            --output build/recordings/MayKernel-Summer-Native-QEMU.mp4 \
            --source-commit "$GITHUB_SHA"
      - name: Verify real QEMU video evidence
        working-directory: MayOS_0.3.0-pre1
        run: |
          python3 scripts/verify_game_recording.py \
            --video build/recordings/MayKernel-Summer-Native-QEMU.mp4 \
            --metadata build/recordings/MayKernel-Summer-Native-QEMU.json \
            --minimum-frames 20
      - name: Upload raw evidence (video, metadata, serial log)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maykernel-native-galgame-qemu-evidence
          if-no-files-found: warn
          path: |
            MayOS_0.3.0-pre1/build/recordings/MayKernel-Summer-Native-QEMU.mp4
            MayOS_0.3.0-pre1/build/recordings/MayKernel-Summer-Native-QEMU.json
            MayOS_0.3.0-pre1/build/recordings/MayKernel-Summer-Native-QEMU.ffmpeg.log
            MayOS_0.3.0-pre1/build/record-bios-custom.log
            MayOS_0.3.0-pre1/build/record-bios-custom-qemu.log
            MayOS_0.3.0-pre1/build/summer-source-commit.txt
