name: Verify Limine BIOS and UEFI boot

on:
  push:
    branches: [main]
    paths:
      - 'MayOS_0.3.0-pre1/boot/limine/**'
      - 'MayOS_0.3.0-pre1/assets/limine-mayos-brand.png'
      - 'MayOS_0.3.0-pre1/scripts/limine_iso.py'
      - 'MayOS_0.3.0-pre1/scripts/test_limine_config.py'
      - 'MayOS_0.3.0-pre1/Makefile'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO, QEMU and firmware tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib xorriso qemu-system-x86 ovmf \
            python3-pil fonts-noto-cjk fonts-dejavu-core
      - name: Fetch pinned Limine v12.10.0 binaries
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 https://github.com/Limine-Bootloader/Limine/releases/download/v12.10.0/limine-binary.tar.gz -o /tmp/limine.tar.gz
          echo '365ba8785d4e4b55c3368738a642681b31f606afec9f77179e07fc26ebe841e2  /tmp/limine.tar.gz' | sha256sum -c -
          tar -xzf /tmp/limine.tar.gz -C /tmp
          cc -std=c99 -D_FILE_OFFSET_BITS=64 -O2 /tmp/limine-binary/limine.c -o /tmp/limine
      - name: Validate Limine configuration and build ISO
        working-directory: MayOS_0.3.0-pre1
        run: |
          set -euxo pipefail
          python3 scripts/test_limine_config.py
          make all
          make limine LIMINE_DIR=/tmp/limine-binary LIMINE=/tmp/limine
      - name: Boot Limine ISO through BIOS and UEFI
        working-directory: MayOS_0.3.0-pre1
        run: |
          set -euxo pipefail
          truncate -s 8M build/limine-test.img
          timeout 25 qemu-system-x86_64 -machine pc -accel tcg -m 128 -vga std \
            -cdrom build/mayos-limine.iso -drive file=build/limine-test.img,format=raw,if=ide \
            -serial file:build/limine-bios.log -display none -no-reboot || test $? -eq 124
          grep -F 'MayOS: desktop ready' build/limine-bios.log
          cp /usr/share/OVMF/OVMF_VARS_4M.fd build/limine-vars.fd
          timeout 25 qemu-system-x86_64 -machine pc -accel tcg -m 128 -vga std \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=build/limine-vars.fd \
            -cdrom build/mayos-limine.iso -drive file=build/limine-test.img,format=raw,if=ide \
            -serial file:build/limine-uefi.log -display none -no-reboot || test $? -eq 124
          grep -F 'MayOS: desktop ready' build/limine-uefi.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: limine-boot-evidence
          path: |
            MayOS_0.3.0-pre1/build/mayos-limine.iso
            MayOS_0.3.0-pre1/build/limine-*.log
