name: Publish MayOS source-only development snapshot
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-source-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prerelease:
    if: github.repository == 'ZhongYeMay/MayOS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate source documentation and the website
        run: |
          python3 website/check_site.py
          python3 -m py_compile MayOS_0.3.0-pre1/scripts/linux.py
          test -f MayOS_0.3.0-pre1/docs/third-party/Fastfetch-MIT.txt
          grep -q 'platform_fastfetch' MayOS_0.3.0-pre1/linux/desktop.c
          grep -q 'direct_copy' MayOS_0.3.0-pre1/linux/desktop.c
      - name: Archive this exact source revision
        env:
          RELEASE_TAG: v0.3.0-pre1-source.1
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/release"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/release/MayOS-0.3.0-pre1-source-update1.zip"
          (
            cd "$RUNNER_TEMP/release"
            sha256sum MayOS-0.3.0-pre1-source-update1.zip > MayOS-0.3.0-pre1-source-update1-SHA256SUMS.txt
          )
          cat > "$RUNNER_TEMP/release/NOTES.md" <<'NOTES'
          ## MayOS 0.3.0-pre1 · Source update 1 (development prerelease)

          **Source-only development snapshot. No updated bootable ISO or new QEMU recordings are included.**

          Changes since the historical MayOS 0.3.0-pre1 binary:
          - Ubuntu-like aubergine windows, orange controls and a less cartoonish interface.
          - Real Fastfetch executable integration for the Linux x86_64 boot environment.
          - Optimized native XRGB8888 scanline copying in the Linux framebuffer backend.
          - Updated responsive MayOS website source and corrected release documentation.
          - Old MayOS 0.1 / 0.2 files removed from the current working tree; history remains.

          Existing tests: MayKernel QEMU regression suite, Linux desktop build and real Fastfetch execution passed in the source CI. **The new Linux dual-boot ISO itself has NOT been built or boot-tested in this release.**

          The archive contains the source code, scripts, website and notices. Read the build instructions in `MayOS_0.3.0-pre1/README.md`. Original Linux/GRUB/BusyBox third-party sources must be obtained/provided as documented when distributing a rebuilt ISO.

          MayOS Team 2023 - 2026.
          This version of MayOS is for test use only.
          NOTES
      - name: Preserve downloadable snapshot even if publishing is blocked
        uses: actions/upload-artifact@v4
        with:
          name: MayOS-0.3.0-pre1-source-update1
          path: |
            ${{ runner.temp }}/release/MayOS-0.3.0-pre1-source-update1.zip
            ${{ runner.temp }}/release/MayOS-0.3.0-pre1-source-update1-SHA256SUMS.txt
            ${{ runner.temp }}/release/NOTES.md
          retention-days: 30
      - name: Publish source-only GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
        run: |
          set -eu
          if gh release view v0.3.0-pre1-source.1 >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite published assets."
            exit 1
          fi
          gh release create v0.3.0-pre1-source.1 \
            "$RUNNER_TEMP/release/MayOS-0.3.0-pre1-source-update1.zip" \
            "$RUNNER_TEMP/release/MayOS-0.3.0-pre1-source-update1-SHA256SUMS.txt" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "MayOS 0.3.0-pre1 · source update 1 (no ISO)" \
            --notes-file "$RUNNER_TEMP/release/NOTES.md"
