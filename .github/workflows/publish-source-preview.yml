name: Publish MayOS source prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Prerelease version without v, for example 0.3.0-pre2"
        required: true
        type: string
      summary:
        description: "Short release highlight"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-mayos-prerelease
  cancel-in-progress: false

jobs:
  prerelease:
    if: github.repository == 'ZhongYeMay/MayOS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate version, source and website
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-pre[1-9][0-9]*$'
          grep -Fq "#define MAYOS_RELEASE \"$VERSION\"" MayOS_0.3.0-pre1/kernel/gui.c
          grep -Fq "VERSION=\"$VERSION\"" MayOS_0.3.0-pre1/scripts/linux.py
          test "$(cat MayOS_0.3.0-pre1/VERSION)" = "$VERSION"
          python3 website/check_site.py
          python3 -m py_compile MayOS_0.3.0-pre1/scripts/linux.py
          sh -n MayOS_0.3.0-pre1/linux/network-start MayOS_0.3.0-pre1/linux/dhcp-hook

      - name: Require successful source CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          checked_sha="$GITHUB_SHA"
          if [ "$(git log -1 --format=%s)" = 'chore(version): increment MayOS prerelease [skip ci]' ]; then
            git fetch --depth=2 origin "$GITHUB_SHA"
            git diff --exit-code HEAD^ HEAD -- . ':!MayOS_0.3.0-pre1/VERSION' ':!MayOS_0.3.0-pre1/kernel/gui.c' ':!MayOS_0.3.0-pre1/kernel/fs.c' ':!MayOS_0.3.0-pre1/scripts/linux.py'
            checked_sha="$(git rev-parse HEAD^)"
          fi
          conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$checked_sha/check-runs" \
            --jq '[.check_runs[] | select(.name == "build") | .conclusion] | first // ""')"
          test "$conclusion" = success

      - name: Create exact source archive and notes
        env:
          VERSION: ${{ inputs.version }}
          SUMMARY: ${{ inputs.summary }}
        run: |
          set -eu
          release_dir="$RUNNER_TEMP/release"
          archive="MayOS-$VERSION-source.zip"
          mkdir -p "$release_dir"
          git archive --format=zip HEAD -o "$release_dir/$archive"
          (cd "$release_dir" && sha256sum "$archive" > "MayOS-$VERSION-SHA256SUMS.txt")
          {
            printf '## MayOS %s · source prerelease\n\n' "$VERSION"
            printf '**Source-only development snapshot. No newly verified bootable ISO is included.**\n\n'
            printf '%s\n\n' "$SUMMARY"
            printf 'Commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'The archive contains the source, scripts, website and notices. '
            printf 'A formal release requires matching bootable artifacts, checksums and boot validation.\n\n'
            printf 'MayOS Team 2023 - 2026.\n'
            printf 'This version of MayOS is for test use only.\n'
          } > "$release_dir/NOTES.md"

      - name: Publish source prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          tag="v$VERSION"
          release_dir="$RUNNER_TEMP/release"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$tag" \
            "$release_dir/MayOS-$VERSION-source.zip" \
            "$release_dir/MayOS-$VERSION-SHA256SUMS.txt" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "MayOS $VERSION · source prerelease" \
            --notes-file "$release_dir/NOTES.md"

      - name: Preserve workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MayOS-${{ inputs.version }}-source
          path: |
            ${{ runner.temp }}/release/MayOS-${{ inputs.version }}-source.zip
            ${{ runner.temp }}/release/MayOS-${{ inputs.version }}-SHA256SUMS.txt
            ${{ runner.temp }}/release/NOTES.md
          retention-days: 30
