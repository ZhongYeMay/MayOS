name: MayKernel SHA256 update integrity tests
on:
  pull_request:
    paths:
      - 'MayOS_0.3.0-pre1/kernel/sha256.*'
      - 'MayOS_0.3.0-pre1/kernel/update.*'
      - 'MayOS_0.3.0-pre1/tests/sha256_test.c'
      - 'MayOS_0.3.0-pre1/tests/update_verify_test.c'
      - 'MayOS_0.3.0-pre1/tests/update_manifest_test.c'
      - 'MayOS_0.3.0-pre1/Makefile'
      - '.github/workflows/maykernel-update-sha.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hash-and-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test streaming SHA256, image integrity, and manifest safety
        run: |
          make -C MayOS_0.3.0-pre1 test-sha256
          make -C MayOS_0.3.0-pre1 test-update-verify
          make -C MayOS_0.3.0-pre1 test-update