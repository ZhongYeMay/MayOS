name: Publish verified MayOS release

on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Version-specific release manifest"
        required: true
        default: ".github/releases/v0.3.0-pre1.json"
        type: string

permissions: {}
concurrency:
  group: publish-mayos-verified-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'ZhongYeMay/MayOS' &&
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify downloads and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          RELEASE_MANIFEST: ${{ inputs.manifest }}
        run: |
          set -eu
          version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag"].removeprefix("v"))' "$RELEASE_MANIFEST")"
          grep -Fq "#define MAYOS_RELEASE \"$version\"" MayOS_0.3.0-pre1/kernel/gui.c
          grep -Fq "VERSION=\"$version\"" MayOS_0.3.0-pre1/scripts/linux.py
          python3 scripts/publish_github_release.py \
            --manifest "$RELEASE_MANIFEST" \
            --output "$RUNNER_TEMP/mayos-release-assets" \
            --target "$GITHUB_SHA" \
            --publish
      - name: Retain only the newly published Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MANIFEST: ${{ inputs.manifest }}
        run: |
          set -eu
          tag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["tag"])' "$RELEASE_MANIFEST")"
          current_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq .id)"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.id != $current_id) | .id" |
          while read -r release_id; do
            [ -z "$release_id" ] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$release_id"
          done
