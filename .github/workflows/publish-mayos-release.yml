name: Publish MayOS 0.3.0-pre1

on:
  push:
    paths:
      - .github/releases/v0.3.0-pre1.json
      - .github/releases/v0.3.0-pre1.md
      - .github/workflows/publish-mayos-release.yml
      - scripts/publish_github_release.py
  workflow_dispatch:

permissions: {}
concurrency:
  group: publish-mayos-v0.3.0-pre1
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'ZhongYeMay/MayOS' &&
      github.ref_type == 'branch' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify downloads and publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
        run: >-
          python3 scripts/publish_github_release.py
          --manifest .github/releases/v0.3.0-pre1.json
          --output "$RUNNER_TEMP/mayos-release-assets"
          --target "$GITHUB_SHA"
          --publish
