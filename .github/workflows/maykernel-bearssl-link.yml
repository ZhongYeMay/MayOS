name: MayKernel optional BearSSL native linkage
on:
  pull_request:
    paths:
      - 'MayOS_0.3.0-pre1/kernel/security_tls_provider.*'
      - 'MayOS_0.3.0-pre1/kernel/security_tls_compat.c'
      - 'MayOS_0.3.0-pre1/kernel/security_tls.c'
      - 'MayOS_0.3.0-pre1/scripts/build_bearssl_freestanding.sh'
      - 'MayOS_0.3.0-pre1/scripts/tls_provider_smoke.py'
      - 'MayOS_0.3.0-pre1/Makefile'
      - '.github/workflows/maykernel-bearssl-link.yml'
  workflow_dispatch:
permissions:
  contents: read
env:
  BEARSSL_PIN: 79c060eea3eea1257797f15ea1608a9a9923aa6f
jobs:
  freestanding-library:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact official upstream BearSSL revision
        run: |
          git clone --quiet https://www.bearssl.org/git/BearSSL vendor/bearssl
          git -C vendor/bearssl checkout -q --detach "$BEARSSL_PIN"
          test "$(git -C vendor/bearssl rev-parse HEAD)" = "$BEARSSL_PIN"
      - name: Compile official BearSSL as freestanding x86_64 archive
        run: |
          make -C MayOS_0.3.0-pre1 \
            BEARSSL_SOURCE="$GITHUB_WORKSPACE/vendor/bearssl" \
            build/libbearssl.a
          readelf -h MayOS_0.3.0-pre1/build/bearssl-objects/ssl/ssl_client.o | grep -F ELF64
      - name: Relocatable-link true BearSSL client engine into MayKernel provider
        run: |
          cd MayOS_0.3.0-pre1
          gcc -m64 -DMAYOS_X86_64 -DMAYOS_USE_BEARSSL \
            -std=gnu11 -O2 -Wall -Wextra -Werror -ffreestanding -fno-pie -fno-pic \
            -fno-stack-protector -fno-builtin -fno-strict-aliasing \
            -fno-asynchronous-unwind-tables -mno-red-zone -mgeneral-regs-only \
            -Ikernel -I"$GITHUB_WORKSPACE/vendor/bearssl/inc" \
            -c kernel/security_tls_provider.c -o build/provider-test.o
          ld -m elf_x86_64 -r -o build/provider-archive-link.o \
            build/provider-test.o build/libbearssl.a
          nm build/provider-archive-link.o | grep -F 'br_ssl_client_init_full'
          echo 'PASS: genuine BearSSL client entrypoint is part of native ELF64 link'
  qemu-native-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: freestanding-library
    steps:
      - uses: actions/checkout@v4
      - name: Install signed QEMU and ISO build dependencies
        run: |
          bash scripts/configure-ci-apt-mirror.sh
          sudo apt-get install -y --no-install-recommends \
            gcc binutils make python3 python3-pil fonts-noto-cjk \
            grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools qemu-system-x86
      - name: Check out pinned official BearSSL
        run: |
          git clone --quiet https://www.bearssl.org/git/BearSSL vendor/bearssl
          git -C vendor/bearssl checkout -q --detach "$BEARSSL_PIN"
          test "$(git -C vendor/bearssl rev-parse HEAD)" = "$BEARSSL_PIN"
      - name: Link actual MayKernel ISO and boot QEMU with linked BearSSL
        run: |
          make -C MayOS_0.3.0-pre1 \
            BEARSSL_SOURCE="$GITHUB_WORKSPACE/vendor/bearssl" \
            test-bearssl-qemu
      - name: Preserve real serial and framebuffer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-maykernel-bearssl-link-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            MayOS_0.3.0-pre1/build/maykernel-bearssl-linked*.png
            MayOS_0.3.0-pre1/build/maykernel-bearssl-linked*.log
            MayOS_0.3.0-pre1/build/maykernel-bearssl-linked*.sock-qemu.log
